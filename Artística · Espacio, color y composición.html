<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artística · Espacio, color y composición</title>
<style>
:root{--bg:#fff7fb;--card:#ffffff;--ink:#2d2a3e;--mut:#6f6a85;--acc:#7b5cd6;--line:#e6dcf3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,"Times New Roman",serif}
header{max-width:780px;margin:0 auto;padding:36px 18px 10px}
h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;margin:0}
header p{color:var(--mut);margin:10px 0 0}
nav{position:sticky;top:0;background:var(--bg);z-index:5;padding:8px 14px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-family:system-ui,sans-serif}
nav button{font:600 .85rem system-ui;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:780px;margin:0 auto;padding:18px 14px 50px;display:grid;gap:22px}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.top{display:flex;gap:14px;align-items:baseline;font-family:system-ui,sans-serif}
.num{font:700 2.6rem Georgia,serif;color:var(--acc);line-height:1}
.mes{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
h2{margin:2px 0 0;font-size:1.5rem}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;font-family:system-ui,sans-serif}
.keys span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 11px;font-size:.8rem;font-weight:600}
details{border-top:1px solid var(--line);padding:9px 0}
summary{cursor:pointer;font:700 .95rem system-ui,sans-serif}
details p{margin:8px 0 2px}
.obra{display:flex;gap:12px;align-items:flex-start;margin:10px 0;padding:10px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 8px 8px 0}
.obra b{display:block}.obra small{color:var(--mut)}
.obra a{font:700 .8rem system-ui,sans-serif;color:var(--acc);white-space:nowrap}
.q{font-style:italic;color:var(--acc);margin:10px 0 0}
.w{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;text-align:center;margin:10px 0;font-family:system-ui,sans-serif}
.w button{font:600 .85rem system-ui;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;margin:3px;cursor:pointer}
.dot{width:46px;height:46px;border-radius:50%;display:inline-block;cursor:pointer;vertical-align:middle;margin:3px;border:2px solid var(--card)}
.hide{display:none}
header{position:relative;overflow:hidden}header>*:not(.bg){position:relative}
.bg span{position:absolute;opacity:.2;animation:fl 9s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-18px) rotate(25deg)}}
.hb{font:700 .95rem system-ui;background:var(--acc);color:#fff;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;margin:3px;transition:transform .15s}.hb:hover{transform:scale(1.07)}
article{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}article.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){article{opacity:1;transform:none}.bg span{animation:none}}
.br{margin:12px 0 0;padding:8px 12px;background:var(--bg);border-radius:8px;font-style:italic;color:var(--mut)}
.cf{position:fixed;top:-14px;width:10px;height:14px;z-index:99;animation:cf 2.6s linear forwards}@keyframes cf{to{transform:translateY(105vh) rotate(720deg)}}
.opt{display:block;width:100%;text-align:left}.ok{background:#2e9e5b!important;color:#fff!important}.no{background:#d62839!important;color:#fff!important}
.tb{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0;align-items:center}.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--card);cursor:pointer}
#star{font:700 .85rem system-ui;align-self:center;margin-left:6px}.w button:hover{transform:scale(1.05)}.w button:active{transform:scale(.95)}
body{background:linear-gradient(160deg,#fff1f6,#eef6ff 45%,#effcf1) fixed}
nav{background:rgba(255,255,255,.75);backdrop-filter:blur(8px)}
article{background:var(--p,#fff);border-color:rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(123,92,214,.10)}
.keys span{background:#fff;border-color:transparent}.obra{background:rgba(255,255,255,.7)}.w{background:rgba(255,255,255,.6)}.br{background:rgba(255,255,255,.65)}
main article:nth-of-type(odd){transform:translateX(-60px) rotate(-1.5deg)}main article:nth-of-type(even){transform:translateX(60px) rotate(1.5deg)}
main article.in{opacity:1;transform:none}
.keys span{opacity:0;transform:scale(.4)}article.in .keys span{opacity:1;transform:none;transition:transform .45s cubic-bezier(.3,1.7,.5,1),opacity .3s}
article.in .keys span:nth-child(1){transition-delay:.25s}article.in .keys span:nth-child(2){transition-delay:.32s}article.in .keys span:nth-child(3){transition-delay:.39s}article.in .keys span:nth-child(4){transition-delay:.46s}article.in .keys span:nth-child(5){transition-delay:.53s}article.in .keys span:nth-child(6){transition-delay:.6s}
.keys span:hover{transform:translateY(-3px) rotate(-3deg)!important}
article.in .num{display:inline-block;animation:pop .8s}@keyframes pop{0%{transform:scale(0) rotate(-120deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:none}}
#pb{position:fixed;top:0;left:0;height:5px;width:0;z-index:30;background:linear-gradient(90deg,#ff9ec4,#9ad0ff,#a8e6b0,#ffe08a)}
.blob{position:fixed;border-radius:50%;z-index:-1;opacity:.55;pointer-events:none}
@media(prefers-reduced-motion:reduce){main article{opacity:1;transform:none}.keys span{opacity:1;transform:none}.blob{display:none}}
</style></head><body>
<header><div class="bg" aria-hidden="true"><span style="left:5%;top:18%;width:44px;height:44px;border-radius:50%;background:#d62839"></span><span style="left:82%;top:12%;width:40px;height:40px;background:#1f5fbf;animation-delay:-3s"></span><span style="left:70%;top:62%;width:0;height:0;border:24px solid transparent;border-bottom:42px solid #f5dc1e;animation-delay:-5s"></span><span style="left:12%;top:70%;width:34px;height:34px;border-radius:50%;background:#2e9e5b;animation-delay:-2s"></span></div><h1>Espacio, color y composición</h1><p>Una guía de lectura para mirar el arte: ideas clave, historia, civilizaciones y obras argentinas. Abrí cada sección, experimentá con los juegos y mirá ejemplos de la vida cotidiana.</p><p><button class="hb" onclick="go('aj')">🎮 Jugá el desafío</button> <button class="hb" onclick="go('al')">🧪 Probá el laboratorio</button></p></header>
<div id="pb"></div><div class="blob" style="left:-60px;top:12%;width:200px;height:200px;background:#ffd6e7"></div><div class="blob" style="right:-50px;top:35%;width:170px;height:170px;background:#cfe8ff"></div><div class="blob" style="left:8%;top:62%;width:130px;height:130px;background:#d6f5d6"></div><div class="blob" style="right:6%;top:80%;width:190px;height:190px;background:#fff0b3"></div><div class="blob" style="left:40%;top:-40px;width:110px;height:110px;background:#e6d9ff"></div><nav id="nav"></nav>
<main id="m"></main>
<script>
const MES={ago:'Agosto · Espacio y forma',sep:'Septiembre · Color',oct:'Octubre · Composición'};
const D=[
{m:'ago',t:'Espacio positivo y negativo',i:'Toda imagen tiene dos partes: la <b>figura</b> (lo que destaca) y el <b>fondo</b>. El espacio que rodea a la figura, el <b>espacio negativo</b>, también es parte de la composición y puede «dibujar» otras formas. Por eso una misma imagen a veces se puede leer de dos maneras.',k:['Figura–fondo','Espacio positivo','Espacio negativo','Ambigüedad visual','Gestalt'],
h:'En 1915 el psicólogo Edgar Rubin dibujó el famoso florero que también se ve como dos caras. La psicología de la Gestalt usa este ejemplo para explicar cómo el cerebro separa la figura del fondo.',
e:[['El logo de FedEx','','Entre la E y la X hay una flecha blanca escondida. Está hecha solo con espacio negativo.'],['Cueva de las Manos (Santa Cruz)','','Hace miles de años, pueblos que vivían en la Patagonia soplaron pintura alrededor de su mano apoyada en la roca. Lo que vemos es el espacio negativo de la mano.','Cueva de las Manos Santa Cruz']],w:'vase',b:'Ya sabemos que el vacío también cuenta. ¿Qué pasa cuando no muestro todo?'},
{m:'ago',t:'Dentro y fuera del marco',i:'El marco recorta el mundo: lo que queda adentro es lo que decidimos mostrar. Un <b>fragmento</b> nos obliga a imaginar lo que hay afuera (<b>continuidad imaginaria</b>). Cambiar el <b>encuadre</b> cambia lo que cuenta la imagen. Una imagen se construye tanto con lo que muestra como con lo que nos hace imaginar.',k:['Encuadre','Fragmento','Reencuadre','Fuera de campo','Escala'],
h:'Cuando se inventó la fotografía (1839), los pintores empezaron a animarse a cortar las escenas en los bordes, como hace una cámara.',
e:[['Recortar una foto','','Con la misma foto, si dejás solo un ojo, una mano o toda la escena, contás cosas distintas.'],['Las viñetas de historieta','','Una viñeta puede mostrar solo un pie o un objeto y vos imaginás el resto de la escena.','Mafalda viñetas Quino']],w:'frame',b:'Supongamos que hay varias cosas dentro del marco: ¿cómo sabemos cuál está adelante y cuál atrás?'},
{m:'ago',t:'Superposición y profundidad',i:'Se puede crear profundidad sin perspectiva: lo que <b>tapa</b> a otra cosa parece estar delante (<b>superposición</b>), lo más chico parece lejano y lo que está más arriba en la hoja parece más lejos. Cada capa es un <b>plano</b>. La hoja es plana: la profundidad no está en el papel, la construimos con señales visuales.',k:['Superposición','Planos','Tamaño relativo','Altura en el plano','Profundidad sin perspectiva'],
h:'La perspectiva con punto de fuga se desarrolló en Italia en el siglo XV. Antes de eso, los artistas lograban profundidad con superposición, tamaño y altura.',
e:[['Videojuegos de plataformas','','Muchos juegos separan el fondo en capas: las lejanas se mueven más lento y las cercanas más rápido.'],['Un paisaje de montañas','','Las montañas más lejanas se ven más claras y más chicas que las cercanas.']],w:'lay',b:'Ya conseguimos que una hoja nos haga imaginar un espacio. Ahora hay que construir los objetos que viven en él: la línea.'},
{m:'ago',t:'La línea como estructura',i:'La línea puede ser <b>contorno</b>, <b>estructura</b> (el esqueleto del objeto), o crear <b>textura</b> y <b>movimiento</b>. Cambiando el grosor (<b>línea modulada</b>) y juntando muchas líneas (<b>trama</b>) aparece el volumen. Además, cada tipo de línea (horizontal, vertical, diagonal, curva, zigzag…) transmite una <b>emoción o un significado</b>.',k:['Contorno','Línea estructural','Línea modulada','Trama','Textura visual','Líneas y emociones'],
h:'Los dibujos más antiguos de la humanidad son líneas y manchas hechas en cuevas.',
e:[['Mafalda','Quino (1932–2020)','Con muy pocas líneas expresa gestos y emociones. Mafalda se publicó por primera vez en 1964.','Quino Mafalda historieta dibujo'],['Mapas y planos','','Las líneas gruesas y finas indican caminos, ríos y límites. La línea también organiza información.'],['Emojis e historietas','','Las líneas en zigzag sugieren enojo o susto, las onduladas movimiento suave y las rayitas alrededor de un personaje indican velocidad.']],w:'lin',b:'Ya tenemos espacio y forma. Ahora llega el color: ¿cómo se organiza?'},
{m:'sep',t:'Primarios, secundarios y terciarios',i:'Los <b>primarios</b> (rojo, amarillo y azul) no se obtienen mezclando otros. Al mezclar dos primarios salen los <b>secundarios</b> (naranja, verde y violeta). Al mezclar un primario con un secundario vecino salen los <b>terciarios</b>. El <b>círculo cromático</b> organiza todo el sistema.',k:['Primarios','Secundarios','Terciarios','Círculo cromático','Mezcla'],
h:'Isaac Newton (1704) usó un prisma para descomponer la luz y ordenó los colores en un círculo. Es el origen de los círculos cromáticos.',
e:[['Témperas y marcadores','','Con rojo, amarillo, azul, blanco y negro podés preparar casi todos los colores.'],['Las impresoras','','Imprimen con solo tres colores y negro (cian, magenta y amarillo) mezclados en puntitos.']],w:'mix',b:'Ya armamos los colores. ¿Cómo hacemos para que se lleven bien entre sí?'},
{m:'sep',t:'Armonías: análogos, complementarios y monocromáticos',i:'En el círculo cromático, los colores <b>análogos</b> son vecinos y se llevan bien. Los <b>complementarios</b> están enfrentados y producen el mayor contraste. Una paleta <b>monocromática</b> usa un solo color con variaciones de valor (más claro o más oscuro).',k:['Análogos','Complementarios','Monocromático','Valor','Contraste'],
h:'Los pintores impresionistas (siglo XIX) ponían colores complementarios uno al lado del otro para que se vean más vivos.',
e:[['Afiches de películas','','Muchos usan azul y naranja, que son complementarios: el contraste hace resaltar a los personajes.'],['El otoño','','Amarillos, naranjas y rojos juntos: colores análogos, cálidos y armoniosos.'],['Rojo y verde de Navidad','','Son complementarios: juntos se ven muy intensos.']],w:'harm',b:'Ya sabemos combinarlos. ¿Y qué sentimos con cada paleta?'},
{m:'sep',t:'Los colores y las emociones',i:'Los colores comunican y despiertan emociones. Los <b>cálidos</b> (rojos, naranjas, amarillos) suelen sentirse enérgicos; los <b>fríos</b> (azules, verdes) más calmos. Pero el significado depende de la <b>cultura</b> y de cada persona.',k:['Colores cálidos','Colores fríos','Emoción','Símbolo','Código'],
h:'En Occidente el luto se asocia al negro; en varios países de Asia, al blanco. Un mismo color puede significar cosas muy distintas.',
e:[['Intensamente (Inside Out)','','Cada emoción tiene su color: alegría amarilla, tristeza azul, ira roja, asco verde y miedo violeta.'],['La camiseta de tu club','','Los colores identifican a una comunidad. Según la historia más difundida, Boca eligió el azul y oro por la bandera de un barco sueco que pasó por el puerto.'],['Semáforos y señales','','Rojo: detenerse; amarillo: precaución; verde: avanzar. Es color usado como código.']],w:'emo',b:'Las emociones guían la mirada. ¿Qué mira primero el ojo en una imagen?'},
{m:'sep',t:'Cómo se lee una imagen: jerarquía, tamaño y color',i:'Una imagen se lee en un orden: primero miramos lo que más destaca. Eso se logra con el <b>tamaño</b>, el <b>color</b> (contraste e intensidad) y la <b>ubicación</b>. Esa organización se llama <b>jerarquía visual</b> y define el <b>punto de atención</b>.',k:['Jerarquía visual','Tamaño','Color y contraste','Punto de atención','Recorrido visual'],
h:'En el Antiguo Egipto el faraón se dibujaba más grande que las demás personas: el tamaño indicaba importancia, no distancia.',
e:[['Miniaturas de YouTube','','Usan una cara grande, colores vivos y texto grande para que lo veas primero.'],['Carteles y publicidades','','Primero ves lo más grande o más colorido; después el resto de la información.']],w:'dom',b:'Si organizamos todo con intención, estamos componiendo.'},
{m:'oct',t:'¿Qué significa componer?',i:'Componer es <b>tomar decisiones</b> sobre qué ocupa cada lugar y por qué. Se organiza con <b>ubicación</b>, <b>tamaño</b>, <b>proporción</b> y <b>peso visual</b> para lograr <b>equilibrio</b> y un <b>centro de interés</b>. Componer no es llenar la hoja. Las <b>líneas</b> de una composición (horizontales, verticales y diagonales) también guían la mirada y cambian la sensación.',k:['Equilibrio','Peso visual','Centro de interés','Proporción','Regla de tercios','Horizontales, verticales y diagonales'],
h:'Muchos pintores y fotógrafos dividen la imagen en tercios y ponen lo importante en los cruces de las líneas.',
e:[['La grilla de la cámara del celular','','Divide la pantalla en tercios para ayudarte a ubicar lo importante.'],['Armar un collage o un afiche','','Cambiar de lugar los mismos elementos cambia lo que transmite.'],['Un paisaje de mar y un bosque','','El mar y el horizonte están hechos de horizontales: transmiten calma. Un bosque de pinos está hecho de verticales: transmite fuerza y altura.']],w:'cmp',b:'¿Y si una mitad es el reflejo de la otra?'},
{m:'oct',t:'Simetría y asimetría',i:'Una imagen es <b>simétrica</b> si sus mitades se reflejan: <b>axial</b> (vertical u horizontal) o <b>radial</b> (alrededor de un centro). Si no, es <b>asimétrica</b>. La simetría transmite calma y orden; la asimetría, movimiento y tensión.',k:['Simetría axial','Simetría radial','Asimetría','Patrón','Equilibrio'],
h:'La simetría se usó mucho en templos y palacios para dar sensación de orden y solemnidad, como en el Taj Mahal (India, siglo XVII).',
e:[['Mariposas y rostros','','Tienen simetría axial: una mitad es casi el reflejo de la otra.'],['Copos de nieve y mandalas','','Tienen simetría radial: se repiten alrededor de un centro.'],['Un logo o un afiche','','Prestá atención: ¿es simétrico o asimétrico? ¿Qué sensación da?']],w:'sym',b:'Ya tenés todas las herramientas: ¡pasá al desafío y al laboratorio!'}
];
const nav=$('nav'),M=$('m');function $(i){return document.getElementById(i)}
nav.innerHTML='<button class="on" data-f="all">Todo</button>'+Object.keys(MES).map(k=>`<button data-f="${k}">${MES[k].split(' · ')[0]}</button>`).join('');
M.innerHTML=D.map((d,n)=>`<article data-m="${d.m}"><div class="top"><span class="num">${n+1}</span><div><div class="mes">${MES[d.m]}</div><h2>${d.t}</h2></div></div>
<p>${d.i}</p><div class="keys">${d.k.map(x=>`<span>${x}</span>`).join('')}</div>${d.w?`<div class="w" id="w${d.w}"></div>`:''}
<details><summary>📜 Un poco de historia</summary><p>${d.h}</p></details>
<details open><summary>🌎 Ejemplos cercanos</summary>${d.e.map(o=>`<div class="obra"><div><b>${o[0]}</b>${o[1]?`<small>${o[1]}</small>`:''}<p style="margin:4px 0 0">${o[2]}</p></div>${o[3]?`<a target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(o[3])}">Ver imagen ↗</a>`:''}</div>`).join('')}</details>${d.b?`<p class="br">➡️ ${d.b}</p>`:''}</article>`).join('');
nav.onclick=e=>{const f=e.target.dataset.f;if(!f)return;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target));M.querySelectorAll('article').forEach(a=>a.classList.toggle('hide',f!='all'&&a.dataset.m!=f))};
// widgets
$('wvase').innerHTML='<svg viewBox="0 0 200 200" width="180"><rect width="200" height="200" fill="#222"/><path id="va" d="M70 10C95 60 95 80 70 110C60 130 60 160 70 190L130 190C140 160 140 130 130 110C105 80 105 60 130 10Z"/><path class="fc" d="M0 0L70 10C95 60 95 80 70 110C60 130 60 160 70 190L0 200Z"/><path class="fc" d="M200 0L130 10C105 60 105 80 130 110C140 160 140 130 130 190L200 200Z" style="display:none"/><path class="fc" d="M200 0L130 10C105 60 105 80 130 110C140 130 140 160 130 190L200 200Z"/></svg><div><button onclick="vs(1)">Ver el florero</button><button onclick="vs(0)">Ver las caras</button></div>';
function vs(a){$('va').setAttribute('fill',a?'#f2c94c':'#333');document.querySelectorAll('.fc').forEach(f=>f.setAttribute('fill',a?'#333':'#e9748c'))}vs(1);
const C={r:'#d62839',a:'#f4c430',b:'#1f5fbf'},NM={r:'rojo',a:'amarillo',b:'azul'},MX={ra:['#f08a1c','naranja'],ab:['#2e9e5b','verde'],rb:['#7a3cb0','violeta']};let pk=[];
$('wmix').innerHTML='Tocá dos primarios: '+Object.keys(C).map(k=>`<span class="dot" style="background:${C[k]}" onclick="mx('${k}')"></span>`).join('')+' <span class="dot" id="mr" style="background:#ccc"></span> <b id="mt">?</b>';
function mx(c){if(pk.length>=2)pk=[];pk.push(c);if(pk.length<2){$('mr').style.background='#ccc';$('mt').textContent=NM[c]+' + …';return}const[a,b]=pk;if(a==b){$('mt').textContent='Es el mismo color';return}const m=MX[[a,b].sort().join('')]||MX[[b,a].join('')]||MX[[a,b].join('')];const key=['ra','ab','rb'].find(k=>k.includes(a)&&k.includes(b));const r=MX[key];$('mr').style.background=r[0];$('mt').textContent=NM[a]+' + '+NM[b]+' = '+r[1]}

$('wcmp').insertAdjacentHTML('beforeend','<hr><b>Las líneas organizan la imagen</b><div class="tb">'+Object.keys(CZ).map(k=>`<button onclick="cz('${k}')">${k}</button>`).join('')+'<button onclick="czg()">👁️ Líneas guía</button></div><svg viewBox="0 0 300 160" width="300" style="max-width:100%;border-radius:10px"><g id="czs"></g><g id="czg" fill="none" stroke="#7b5cd6" stroke-width="2.5" stroke-dasharray="6 5" style="opacity:0;transition:opacity .4s"></g></svg><div id="czt" style="min-height:3em"></div>');
function cz(k){$('czs').innerHTML=CZ[k][0];$('czg').innerHTML=CZ[k][1];$('czt').innerHTML=`<b>${k}:</b> ${CZ[k][2]}`}function czg(){const g=$('czg');g.style.opacity=g.style.opacity==1?0:1}cz('Horizontal');

// simetría con formas
let SY=[],ssh='c',scol='#d62839',ssz=26,smode='m',son=true,sd=-1,sinv=null,sdx=0,sdy=0;
$('wsym').innerHTML='<p style="margin:4px 0">Poné formas en un ala: <b>el espejo hace el resto</b>. Arrastralas y mirá cómo se mueve el reflejo.</p><div class="tb"><button onclick="sm(\'m\')">🦋 Mariposa</button><button onclick="sm(\'r\')">❄️ Mandala</button></div><div class="tb">'+[['c','● Círculo'],['s','■ Cuadrado'],['t','▲ Triángulo'],['e','★ Estrella']].map(a=>`<button onclick="ssh='${a[0]}'">${a[1]}</button>`).join('')+'</div><div class="tb">'+RY.map(c=>`<span class="sw" style="background:${c[1]}" onclick="scol='${c[1]}'"></span>`).join('')+'</div><div class="tb">Tamaño <input type="range" min="10" max="50" value="26" oninput="ssz=+this.value"></div><svg id="sy" viewBox="0 0 360 250" style="width:100%;background:#fff;border:2px solid #222;border-radius:10px;touch-action:none"><g id="sbg"></g><g id="sg"></g></svg><div class="tb"><button id="sbtn" onclick="son=!son;sr()">Simetría: SÍ</button><button onclick="SY.pop();sr()">↩️ Deshacer</button><button onclick="SY=[];sr()">🧽 Borrar</button></div><div id="stx" style="min-height:3em"></div>';
function sm(m){smode=m;SY=[];sr()}
function el2(m){const e=document.createElementNS(NS,m.t=='c'?'circle':m.t=='s'?'rect':'polygon');e.dataset.t=m.t;e.dataset.x=m.x;e.dataset.y=m.y;e.dataset.r=m.r;if(m.t=='c')e.setAttribute('r',m.r);if(m.t=='s'){e.setAttribute('width',m.r*2);e.setAttribute('height',m.r*2)}e.setAttribute('fill',m.c);e.setAttribute('stroke','#fff');e.setAttribute('stroke-width',2);e.style.cursor='grab';pl(e);return e}
function sr(){let bg='';if(smode=='m')bg='<ellipse cx="110" cy="95" rx="75" ry="58" fill="#faf5ff" stroke="#cbbbe8" stroke-width="3"/><ellipse cx="250" cy="95" rx="75" ry="58" fill="#faf5ff" stroke="#cbbbe8" stroke-width="3"/><ellipse cx="125" cy="170" rx="52" ry="42" fill="#faf5ff" stroke="#cbbbe8" stroke-width="3"/><ellipse cx="235" cy="170" rx="52" ry="42" fill="#faf5ff" stroke="#cbbbe8" stroke-width="3"/><ellipse cx="180" cy="130" rx="9" ry="72" fill="#6a5a7a"/><path d="M180 60Q165 30 150 25M180 60Q195 30 210 25" stroke="#6a5a7a" stroke-width="3" fill="none"/>';else bg='<g fill="none" stroke="#d9cdf0" stroke-width="2" stroke-dasharray="5 5"><circle cx="180" cy="125" r="40"/><circle cx="180" cy="125" r="80"/><circle cx="180" cy="125" r="118"/>'+[0,1,2,3,4,5].map(k=>`<path d="M180 125V0" transform="rotate(${k*60} 180 125)"/>`).join('')+'</g><circle cx="180" cy="125" r="5" fill="#6a5a7a"/>';
$('sbg').innerHTML=bg;$('sbg').style.pointerEvents='none';
const tr=smode=='m'?(son?['','translate(360 0) scale(-1 1)']:['']):(son?[0,1,2,3,4,5].map(k=>`rotate(${k*60} 180 125)`):['']);
$('sg').innerHTML='';SY.forEach((m,i)=>tr.forEach(t=>{const g=document.createElementNS(NS,'g');g.setAttribute('transform',t);g.dataset.i=i;g.appendChild(el2(m));$('sg').appendChild(g)}));
$('sbtn').textContent='Simetría: '+(son?'SÍ':'NO');$('stx').innerHTML=son?'<b>Simétrica:</b> se siente ordenada y tranquila.':'<b>Asimétrica:</b> se siente con más movimiento y tensión. Compará con la simétrica.'}
$('sy').addEventListener('pointerdown',e=>{const g=e.target.parentNode,sp=$('sy').createSVGPoint();sp.x=e.clientX;sp.y=e.clientY;if(g&&g.parentNode&&g.parentNode.id=='sg'){sd=+g.dataset.i;sinv=g.getScreenCTM().inverse();const q=sp.matrixTransform(sinv);sdx=SY[sd].x-q.x;sdy=SY[sd].y-q.y;$('sy').setPointerCapture(e.pointerId)}else{const q=sp.matrixTransform($('sy').getScreenCTM().inverse());SY.push({t:ssh,x:q.x,y:q.y,r:ssz,c:scol});sr()}});
$('sy').addEventListener('pointermove',e=>{if(sd<0)return;const sp=$('sy').createSVGPoint();sp.x=e.clientX;sp.y=e.clientY;const q=sp.matrixTransform(sinv);SY[sd].x=q.x+sdx;SY[sd].y=q.y+sdy;sr()});
$('sy').addEventListener('pointerup',()=>sd=-1);sr();
document.querySelectorAll('.w:not(.nl)').forEach(w=>w.insertAdjacentHTML('afterbegin','<div style="font-weight:700;margin-bottom:6px">🧪 Experimentá</div>'));

const PA=['#ffe3ec','#dff1ff','#e4f7df','#fff2c9','#ece2ff','#ffe8d4','#d9f6ee','#ffe4f4','#e1e8ff','#f1fbd2','#ffe9e0','#e0f7ff'];
document.querySelectorAll('article').forEach((a,i)=>a.style.setProperty('--p',PA[i%PA.length]));
const bl=document.querySelectorAll('.blob'),hs=document.querySelectorAll('.bg span');let tk=0;
function sc(){tk=0;const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;$('pb').style.width=(h>0?y/h*100:0)+'%';bl.forEach((b,i)=>b.style.transform=`translateY(${-y*(.06+.04*i)}px) rotate(${y*.05}deg)`);hs.forEach((b,i)=>b.style.translate=`0 ${y*(.15+.05*i)}px`)}
addEventListener('scroll',()=>{if(!tk){tk=1;requestAnimationFrame(sc)}},{passive:true});sc();
</script></body></html>
